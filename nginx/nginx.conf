server{
    listen: 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /{
        try files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1m;
        add_header Cache-Control "public, immutable";
    }
}